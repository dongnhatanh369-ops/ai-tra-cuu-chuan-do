<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Tra Cứu Chuẩn Độ</title><link rel="stylesheet" href="./styles.css"></head><body><main class="app-shell"><p class="eyebrow">AI CHUẨN ĐỘ</p><h1>Tra cứu tài liệu hóa học</h1><p class="subtitle">Đặt câu hỏi về phương pháp chuẩn độ, công thức, chỉ thị hoặc quy trình thí nghiệm.</p><section class="chat-card"><div id="conversation" class="conversation" aria-live="polite"><div class="message assistant">Xin chào! Tôi có thể hỗ trợ tra cứu tài liệu chuẩn độ. Bạn muốn tìm hiểu điều gì?</div></div><form id="question-form"><textarea id="question" rows="3" maxlength="2000" placeholder="Ví dụ: Chuẩn độ HCl bằng NaOH nên dùng chỉ thị nào?" required></textarea><div class="form-footer"><span id="status">Sẵn sàng</span><button type="submit" id="send-button">Gửi câu hỏi</button></div></form></section><p class="notice">Thông tin AI cần được kiểm tra với tài liệu và quy định an toàn phòng thí nghiệm.</p></main><script src="./app.js" type="module"></script></body></html>
